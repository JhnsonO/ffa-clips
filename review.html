<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFA Clip Review</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap');

  :root {
    --green: #00e676;
    --red: #ff1744;
    --yellow: #ffea00;
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #222;
    --text: #f0f0f0;
    --muted: #666;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 1.5rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  header h1 span { color: var(--green); }

  #stats {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  #stats b { color: var(--text); }

  #load-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    gap: 16px;
    padding: 40px;
    text-align: center;
  }

  #load-section h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  #load-section p { color: var(--muted); font-size: 0.9rem; max-width: 400px; line-height: 1.6; }

  .btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 28px;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--green); color: #000; }
  .btn-danger  { background: var(--red);   color: #fff; }
  .btn-ghost   { background: transparent; color: var(--muted); border: 1px solid var(--border); }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1px;
    background: var(--border);
    padding: 1px;
  }

  .card {
    background: var(--surface);
    display: flex;
    flex-direction: column;
    transition: background 0.2s;
  }

  .card.approved  { outline: 2px solid var(--green); }
  .card.rejected  { outline: 2px solid var(--red); opacity: 0.5; }

  .card video {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    display: block;
  }

  .card-body {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .card-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .card-cam {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: monospace;
  }

  .card-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .card-actions .btn {
    font-size: 0.85rem;
    padding: 9px 0;
    width: 100%;
  }

  .status-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 2px;
  }
  .status-badge.approved { background: var(--green); color: #000; }
  .status-badge.rejected { background: var(--red);   color: #fff; }
  .status-badge.pending  { background: var(--border); color: var(--muted); }

  #toolbar {
    padding: 12px 24px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  #toolbar .btn { font-size: 0.8rem; padding: 8px 18px; }

  #export-info {
    margin-left: auto;
    font-size: 0.8rem;
    color: var(--muted);
  }

  #export-list {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px 24px;
    margin: 20px 24px;
    font-size: 0.85rem;
    line-height: 1.8;
  }
  #export-list h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
    color: var(--green);
  }
  #export-list pre {
    background: #000;
    padding: 12px;
    overflow-x: auto;
    font-size: 0.8rem;
    color: var(--yellow);
    margin-top: 8px;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .empty { text-align: center; padding: 60px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>FFA <span>Clip Review</span></h1>
  <div id="stats">Load a manifest to begin</div>
</header>

<div id="load-section">
  <h2>Load Session</h2>
  <p>After running <code>process.py</code>, load the <strong>manifest.json</strong> file from your output folder.</p>
  <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">Load manifest.json</button>
  <p style="font-size:0.8rem">Videos are loaded directly from your local disk — nothing is uploaded anywhere.</p>
  <input type="file" id="file-input" accept=".json" style="display:none" onchange="loadManifest(event)">
</div>

<div id="app" style="display:none">
  <div id="toolbar">
    <button class="btn btn-primary" onclick="approveAll()">✓ Approve All</button>
    <button class="btn btn-danger"  onclick="rejectAll()">✗ Reject All</button>
    <button class="btn btn-ghost"   onclick="resetAll()">Reset</button>
    <span id="export-info"></span>
    <button class="btn btn-primary" style="margin-left:auto" onclick="showExport()">Export Approved →</button>
  </div>

  <div id="export-list"></div>
  <div id="grid"></div>
</div>

<script>
let clips = [];
let clipsDir = '';
let videoFolder = null;

function loadManifest(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const data = JSON.parse(ev.target.result);
    clips = data.clips || [];
    clipsDir = data.clips_dir || '';
    document.getElementById('load-section').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    promptVideoFolder();
  };
  reader.readAsText(file);
}

function promptVideoFolder() {
  // Ask user to select the clips folder so we can load videos
  const msg = document.createElement('div');
  msg.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:999';
  msg.innerHTML = `
    <div style="background:#141414;border:1px solid #333;padding:32px;max-width:420px;text-align:center">
      <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px">Select Clips Folder</h2>
      <p style="color:#666;font-size:.9rem;line-height:1.6;margin-bottom:20px">
        Select the <strong style="color:#fff">clips/</strong> folder inside your output directory so the browser can load your videos.
      </p>
      <button class="btn btn-primary" id="folder-btn" style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;padding:12px 28px;border:none;cursor:pointer;background:#00e676;color:#000">
        Select Folder
      </button>
    </div>
  `;
  document.body.appendChild(msg);

  msg.querySelector('#folder-btn').onclick = () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.webkitdirectory = true;
    input.onchange = ev => {
      videoFolder = {};
      for (const f of ev.target.files) {
        videoFolder[f.name] = URL.createObjectURL(f);
      }
      document.body.removeChild(msg);
      renderGrid();
    };
    input.click();
  };
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (!clips.length) {
    grid.innerHTML = '<div class="empty">No clips found in manifest.</div>';
    return;
  }

  clips.forEach((clip, idx) => {
    const src = videoFolder?.[clip.file] || '';
    const card = document.createElement('div');
    card.className = 'card' + (clip.approved === true ? ' approved' : clip.approved === false ? ' rejected' : '');
    card.id = `card-${idx}`;

    const status = clip.approved === true ? 'approved' : clip.approved === false ? 'rejected' : 'pending';
    card.innerHTML = `
      <video src="${src}" controls preload="metadata" playsinline></video>
      <div class="card-body">
        <div class="card-meta">
          <span class="card-label">${clip.label}</span>
          <span class="card-cam">${clip.cam}</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="status-badge ${status}" id="badge-${idx}">${status}</span>
        </div>
        <div class="card-actions">
          <button class="btn btn-primary" onclick="approve(${idx})">✓ Keep</button>
          <button class="btn btn-danger"  onclick="reject(${idx})">✗ Skip</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  updateStats();
}

function approve(idx) {
  clips[idx].approved = true;
  updateCard(idx);
}

function reject(idx) {
  clips[idx].approved = false;
  updateCard(idx);
}

function updateCard(idx) {
  const card = document.getElementById(`card-${idx}`);
  const badge = document.getElementById(`badge-${idx}`);
  const clip = clips[idx];
  card.className = 'card' + (clip.approved === true ? ' approved' : clip.approved === false ? ' rejected' : '');
  const status = clip.approved === true ? 'approved' : clip.approved === false ? 'rejected' : 'pending';
  badge.className = `status-badge ${status}`;
  badge.textContent = status;
  updateStats();
}

function approveAll() { clips.forEach((_, i) => { clips[i].approved = true; updateCard(i); }); }
function rejectAll()  { clips.forEach((_, i) => { clips[i].approved = false; updateCard(i); }); }
function resetAll()   { clips.forEach((_, i) => { clips[i].approved = null; updateCard(i); }); }

function updateStats() {
  const approved = clips.filter(c => c.approved === true).length;
  const rejected = clips.filter(c => c.approved === false).length;
  const pending  = clips.filter(c => c.approved === null || c.approved === undefined).length;
  document.getElementById('stats').innerHTML =
    `<b>${clips.length}</b> clips &nbsp;·&nbsp; <b style="color:#00e676">${approved}</b> kept &nbsp;·&nbsp; <b style="color:#ff1744">${rejected}</b> skipped &nbsp;·&nbsp; ${pending} pending`;
  document.getElementById('export-info').textContent =
    approved ? `${approved} clip${approved > 1 ? 's' : ''} ready to export` : '';
}

function showExport() {
  const approved = clips.filter(c => c.approved === true);
  const box = document.getElementById('export-list');

  if (!approved.length) {
    box.style.display = 'block';
    box.innerHTML = '<h3>No clips approved yet</h3><p style="color:#666">Approve some clips first, then export.</p>';
    return;
  }

  const files = approved.map(c => c.file).join('\n');
  box.style.display = 'block';
  box.innerHTML = `
    <h3>✓ ${approved.length} Approved Clips</h3>
    <p style="color:#666;margin-bottom:8px">These files are in your <strong style="color:#fff">output/clips/</strong> folder and are ready to post:</p>
    ${approved.map(c => `<div style="padding:4px 0;border-bottom:1px solid #1a1a1a">
      <span style="color:#00e676;font-family:monospace">${c.file}</span>
      <span style="color:#666;font-size:.8rem;margin-left:12px">${c.label}</span>
    </div>`).join('')}
    <p style="color:#666;font-size:.8rem;margin-top:12px">
      Tip: You can drag these MP4s directly into Instagram, TikTok, or YouTube Shorts.
    </p>
  `;
  box.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
